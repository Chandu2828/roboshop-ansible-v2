[defaults]
inventory = ./inventory.ini
log_path = /var/log/roboshop/ansible.log
; ask_vault_pass = True # This is to avoid passing --ask-vault-pass with playbook execution command 
vault_password_file = ~/roboshop-ansible-v2/.vault_pass
# As this file is mentioned in git ignore you need to create a vault_pass in your ec2 ansible host